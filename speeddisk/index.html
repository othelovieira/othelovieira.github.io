<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Norton Speed Disk Simulator</title>

<style>

body {
    background:#0000AA;
    color:#FFFFFF;
    font-family:"Courier New",monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    user-select:none;
}

.dos-window {
    box-sizing:border-box;
    width:min(798px, calc(100vw - 32px));
    padding:15px;
    border:4px double #55FFFF;
    background:#0000AA;
    box-shadow:12px 12px 0 #000;
}

.header {
    background:#55FFFF;
    color:#0000AA;
    font-weight:bold;
    text-align:center;
    padding:4px;
    margin-bottom:12px;
}

.device-info {
    margin-bottom:12px;
    text-align:center;
    color:#FFFF55;
    font-size:13px;
}

.disk-map {
    display:grid;
    grid-template-columns:repeat(50,minmax(0,1fr));
    gap:2px;
    background:#000055;
    border:2px solid #AAAAAA;
    padding:8px;
    margin-bottom:15px;
}

.cluster {
    box-sizing:border-box;
    width:100%;
    min-width:0;
    height:14px;
    font-size:11px;
    line-height:14px;
    text-align:center;
    font-weight:bold;
}

.empty {
    background:#000055;
    color:#555555;
}

.fragmented {
    background:#AAAA00;
    color:#000000;
}

.optimized {
    background:#55FFFF;
    color:#0000AA;
}

.unmovable {
    background:#AA0000;
    color:#FFFFFF;
}

.reading {
    background:#FFFFFF;
    color:#0000AA;
}

.writing {
    background:#FFFFFF;
    color:#AA0000;
}

.status-panel {
    display:flex;
    justify-content:space-between;
    border-top:2px solid #55FFFF;
    padding-top:10px;
    font-size:14px;
}

.legend {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 20px;
}

.legend-item {
    display:flex;
    align-items:center;
    gap:8px;
}

.swatch {
    width:14px;
    height:14px;
    display:inline-block;
    text-align:center;
    font-size:11px;
}

.controls {
    margin-top:15px;
    display:flex;
    justify-content:center;
    gap:10px;
}

button {
    background:#AAAAAA;
    color:#000000;
    border:2px outset #FFFFFF;
    font-family:inherit;
    font-weight:bold;
    padding:6px 14px;
    cursor:pointer;
}

button:active {
    border-style:inset;
}

@media (max-width: 600px) {
    .dos-window {
        padding:10px;
    }

    .disk-map {
        gap:1px;
        padding:5px;
    }

    .cluster {
        height:clamp(5px, 2.4vw, 14px);
        font-size:clamp(4px, 1.8vw, 11px);
        line-height:1;
    }

    .status-panel {
        flex-direction:column;
        gap:12px;
    }

    .controls {
        flex-direction:column;
    }
}

</style>
</head>

<body>

<div class="dos-window">

    <div class="header">
        NORTON SPEED DISK - Drive C: [MS-DOS 3.30]
    </div>

    <div id="deviceInfo" class="device-info" role="status" aria-live="polite"></div>

    <div id="diskMap" class="disk-map"></div>

    <div class="status-panel">

        <div>
            <div>Status: <span id="statusText" style="color:#FFFF55">READY</span></div>
            <div>Cluster: <span id="clusterNum">0000</span> / 750</div>
            <div>Progress: <span id="progressPct">0</span>%</div>
        </div>

        <div class="legend">

            <div class="legend-item">
                <span class="swatch optimized">■</span>
                Optimized
            </div>

            <div class="legend-item">
                <span class="swatch reading">r</span>
                Reading
            </div>

            <div class="legend-item">
                <span class="swatch fragmented">▒</span>
                Fragmented
            </div>

            <div class="legend-item">
                <span class="swatch writing">W</span>
                Writing
            </div>

            <div class="legend-item">
                <span class="swatch empty">·</span>
                Unused
            </div>

            <div class="legend-item">
                <span class="swatch unmovable">X</span>
                Unmovable
            </div>

        </div>

    </div>

    <div class="controls">
        <button onclick="startDefrag()">[F1] Start Optimization</button>
        <button onclick="initDisk()">[F2] Scramble Disk</button>
    </div>

</div>

<script>

const COLS = 50;
const ROWS = 15;
const TOTAL_CLUSTERS = COLS * ROWS;

let disk = [];
let intervalId = null;
let optimizePointer = 15;

function updateDeviceInfo() {
    const mobileHint = navigator.userAgentData?.mobile;
    const isMobile = typeof mobileHint === "boolean"
        ? mobileHint
        : window.matchMedia("(pointer: coarse)").matches ||
          (
              window.matchMedia("(max-width: 768px)").matches &&
              navigator.maxTouchPoints > 0
          );

    document.getElementById("deviceInfo").textContent =
        `Running on: ${isMobile ? "Mobile device" : "Desktop"}`;
}

const SYMBOLS = {
    empty: "·",
    fragmented: "▒",
    optimized: "■",
    unmovable: "X",
    reading: "r",
    writing: "W"
};

function initDisk() {

    clearInterval(intervalId);
    intervalId = null;

    optimizePointer = 15;

    disk = [];

    for (let i = 0; i < TOTAL_CLUSTERS; i++) {

        const rand = Math.random();

        if (i < 15) {
            disk.push("unmovable");
        }
        else if (rand < 0.04) {
            disk.push("unmovable");
        }
        else if (rand < 0.55) {
            disk.push("fragmented");
        }
        else {
            disk.push("empty");
        }
    }

    document.getElementById("statusText").textContent =
        "FRAGMENTED";

    document.getElementById("progressPct").textContent =
        "0";

    document.getElementById("clusterNum").textContent =
        "0000";

    render();
}

function render(readIdx = -1, writeIdx = -1) {

    const mapEl =
        document.getElementById("diskMap");

    mapEl.innerHTML = "";

    disk.forEach((state, idx) => {

        let displayState = state;

        if (idx === readIdx)
            displayState = "reading";

        if (idx === writeIdx)
            displayState = "writing";

        const div =
            document.createElement("div");

        div.className =
            `cluster ${displayState}`;

        div.textContent =
            SYMBOLS[displayState];

        mapEl.appendChild(div);
    });
}

function startDefrag() {

    if (intervalId)
        return;

    document.getElementById("statusText").textContent =
        "OPTIMIZING...";

    intervalId = setInterval(() => {

        const fragmented = [];

        for (let i = 0; i < TOTAL_CLUSTERS; i++) {

            if (disk[i] === "fragmented") {
                fragmented.push(i);
            }
        }

        if (fragmented.length === 0) {

            clearInterval(intervalId);
            intervalId = null;

            document.getElementById("statusText").textContent =
                "OPTIMIZATION COMPLETE!";

            document.getElementById("progressPct").textContent =
                "100";

            render();

            return;
        }

        while (
            optimizePointer < TOTAL_CLUSTERS &&
            (
                disk[optimizePointer] === "unmovable" ||
                disk[optimizePointer] === "optimized"
            )
        ) {
            optimizePointer++;
        }

        if (optimizePointer >= TOTAL_CLUSTERS) {

            clearInterval(intervalId);
            intervalId = null;

            document.getElementById("statusText").textContent =
                "OPTIMIZATION COMPLETE!";

            render();

            return;
        }

        const readIdx =
            fragmented[
                Math.floor(
                    Math.random() * fragmented.length
                )
            ];

        const writeIdx =
            optimizePointer;

        render(readIdx, writeIdx);

        setTimeout(() => {

            disk[readIdx] = "empty";
            disk[writeIdx] = "optimized";

            optimizePointer++;

            render();

            document.getElementById("clusterNum").textContent =
                String(writeIdx).padStart(4, "0");

            const optimized =
                disk.filter(
                    x => x === "optimized"
                ).length;

            const active =
                disk.filter(
                    x =>
                        x === "optimized" ||
                        x === "fragmented"
                ).length;

            document.getElementById("progressPct").textContent =
                Math.floor(
                    (optimized / active) * 100
                );

        }, 150);

    }, 200);
}

updateDeviceInfo();
window.addEventListener("resize", updateDeviceInfo);
initDisk();

</script>

</body>
</html>
